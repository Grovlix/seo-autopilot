# seo-autopilot: checks every pull request opened from an SEO branch (seo/*). It runs your normal build with NO secrets and
# READ-ONLY permissions, so project code that runs during the build cannot reach anything valuable, whatever text the
# pull request's content came from. Make this check "required" in your branch protection to block a bad merge.
#
# EDIT the build command if yours is not `npm run build`.
name: seo-check
on:
  pull_request:
    branches: [main, master]
  # Called by the scheduled seo-autopilot workflow with the drafted branch. No secrets are passed to it.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        required: true

permissions:
  contents: read

env:
  SEO: "{{SPEC}}"

jobs:
  build:
    if: startsWith(github.head_ref, 'seo/') || startsWith(inputs.ref, 'seo/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Content-loss guard: fails when a changed page lost more than 15% of its words (contentGuard.maxWordDropPercent in
      # the BASE branch's config) or any heading, internal link, image or structured data, or when a page was removed.
      # It runs before the install and build, so nothing from the pull request has run yet. Human-only override: a person
      # other than the pull request's author adds the label allow-content-shrink and re-runs this check (the label and who
      # added it are read from the pull request's events; a bot never counts, and the autopilot and agents never add it).
      # A seo/revert-<n> branch may restore older content only when seo-watch opened it: the pull request's author and the
      # account that added its seo-revert label must both be the workflow's bot. When seo-watch calls this check there is
      # no pull_request event, so the pull request is looked up by its branch.
      - name: Content-loss guard on the changed pages
        env:
          BASE: ${{ inputs.base || github.base_ref }}
          BRANCH: ${{ inputs.ref || github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          labels=""; : > "$RUNNER_TEMP/label-events.jsonl"
          if [ -z "${PR:-}" ] && [ -n "${BRANCH:-}" ]; then
            found=$(gh api "repos/$GH_REPO/pulls?state=open&head=${GH_REPO%%/*}:$BRANCH" --jq '.[0] // empty | "\(.number) \(.user.login)"' 2>/dev/null || true)
            if [ -n "$found" ]; then PR="${found%% *}"; AUTHOR="${found#* }"; fi
          fi
          if [ -n "${PR:-}" ]; then
            labels=$(gh api "repos/$GH_REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' 2>/dev/null || true)
            case ",$labels," in *,allow-content-shrink,*|*,seo-revert,*)
              gh api "repos/$GH_REPO/issues/$PR/events" --paginate --jq '.[] | select(.event == "labeled") | {event, label: .label.name, actor: .actor.login, type: .actor.type}' > "$RUNNER_TEMP/label-events.jsonl" 2>/dev/null || : > "$RUNNER_TEMP/label-events.jsonl";;
            esac
          fi
          npx --yes "$SEO" run content-guard --base "origin/$BASE" --branch="$BRANCH" --labels="$labels" --events "$RUNNER_TEMP/label-events.jsonl" --author="${AUTHOR:-}"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || { echo "::warning::npm ci rejected package-lock.json (often a different npm version than the one that wrote it). Falling back to npm install for this check; regenerate and commit the lockfile when you can."; npm install --no-audit --no-fund; }
          elif [ -f package.json ]; then npm install --no-audit --no-fund; fi
      - name: Build and validate the content
        run: npm run build
      # Every number, price, award or client claim in the changed content must be in verified-facts.json or carry a source.
      # Warns by default; set "facts": { "strict": true } in seo-autopilot.config.json to make an unverified claim fail the check.
      - name: Facts guard on the changed content
        env:
          BASE: ${{ inputs.base || github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD" -- '*.json' '*.md' '*.mdx' | { grep -v '^seo-autopilot' || true; } | paste -sd, -)
          if [ -n "$files" ]; then npx --yes "$SEO" run facts --files "$files"; else echo "No content files changed."; fi
