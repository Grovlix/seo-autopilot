# seo-autopilot: checks every pull request opened from an SEO branch (seo/*). It runs your normal build with NO secrets and
# READ-ONLY permissions, so project code that runs during the build cannot reach anything valuable, whatever text the
# pull request's content came from. Make this check "required" in your branch protection to block a bad merge.
#
# EDIT the build command if yours is not `npm run build`.
name: seo-check
on:
  pull_request:
    branches: [main, master]
  # Called by the scheduled seo-autopilot workflow with the drafted branch. No secrets are passed to it.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        required: true
  # Started by seo-implement on the drafted branch right after it opens the pull request: a pull request opened with the
  # workflow token starts no pull_request run, but a dispatch does. A dispatched (or called) run's check is not listed on
  # the pull request, so the "status" job below also posts the result as the commit status "seo-check".
  workflow_dispatch:
    inputs:
      ref:
        description: "The seo/ branch to check"
        type: string
        required: true
      base:
        description: "The branch the pull request merges into"
        type: string
        required: true

permissions:
  contents: read

env:
  SEO: "{{SPEC}}"

jobs:
  build:
    if: startsWith(github.head_ref, 'seo/') || startsWith(inputs.ref, 'seo/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || { echo "::warning::npm ci rejected package-lock.json (often a different npm version than the one that wrote it). Falling back to npm install for this check; regenerate and commit the lockfile when you can."; npm install --no-audit --no-fund; }
          elif [ -f package.json ]; then npm install --no-audit --no-fund; fi
      - name: Build and validate the content
        run: npm run build
      # Every number, price, award or client claim in the changed content must be in verified-facts.json or carry a source.
      # Warns by default; set "facts": { "strict": true } in seo-autopilot.config.json to make an unverified claim fail the check.
      - name: Facts guard on the changed content
        env:
          BASE: ${{ inputs.base || github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD" -- '*.json' '*.md' '*.mdx' | { grep -v '^seo-autopilot' || true; } | paste -sd, -)
          if [ -n "$files" ]; then npx --yes "$SEO" run facts --files "$files"; else echo "No content files changed."; fi

  # Dispatched or called runs only (a pull_request run is already listed on the pull request). Posts the build result as the
  # commit status "seo-check" on the branch's head commit, where the pull request, branch protection and seo-automerge see
  # it. A separate job: the build above, which runs project code, never holds a token that can write anything.
  status:
    needs: build
    if: always() && startsWith(inputs.ref, 'seo/') && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post the build result as the commit status
        env:
          GH_TOKEN: ${{ github.token }}   # this job's own token: statuses only, no repository secrets
          GH_REPO: ${{ github.repository }}
          REF: ${{ inputs.ref }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A run dispatched on the branch carries the commit that was built. A called run carries the caller's commit
          # (and the caller's event name), so read the branch head (only the drafter writes seo/ branches; it has finished).
          if [ "$GITHUB_REF" = "refs/heads/$REF" ]; then sha="$GITHUB_SHA"; else sha=$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha); fi
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api "repos/$GH_REPO/statuses/$sha" -f state="$state" -f context=seo-check -f description="Build and facts guard: $RESULT" -f target_url="$RUN_URL" > /dev/null
