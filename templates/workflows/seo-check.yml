# seo-autopilot: checks every pull request opened from an SEO branch (seo/*). It runs your normal build with NO secrets and
# READ-ONLY permissions, so project code that runs during the build cannot reach anything valuable, whatever text the
# pull request's content came from. Make this check "required" in your branch protection to block a bad merge.
#
# EDIT the build command if yours is not `npm run build`.
name: seo-check
on:
  pull_request:
    branches: [main, master]
  # Called by the scheduled seo-autopilot workflow with the drafted branch. No secrets are passed to it.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        required: true
  # Started by seo-implement on the drafted branch right after it opens the pull request: a pull request opened with the
  # workflow token starts no pull_request run, but a dispatch does. A dispatched (or called) run's check is not listed on
  # the pull request, so the "status" job below also posts the result as the commit status "seo-check".
  workflow_dispatch:
    inputs:
      ref:
        description: "The seo/ branch to check"
        type: string
        required: true
      base:
        description: "The branch the pull request merges into"
        type: string
        required: true

permissions:
  contents: read

env:
  SEO: "{{SPEC}}"

jobs:
  build:
    if: startsWith(github.head_ref, 'seo/') || startsWith(inputs.ref, 'seo/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only. issues/pull-requests: read are for the content-loss guard (labels, label events, pull requests by branch),
    # which fails closed on a private repository when the token cannot read them. The build itself can write nothing.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      sha: ${{ steps.head.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || '' }}
      # The commit this run builds, recorded before any project code runs; the status job reports on exactly this commit.
      # A pull_request run builds a temporary merge commit, so its result belongs to the pull request's head commit.
      - name: Record the commit being checked
        id: head
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha || '' }}
        run: echo "sha=${PR_HEAD:-$(git rev-parse HEAD)}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Content-loss guard: fails when a changed page lost more than 15% of its words (contentGuard.maxWordDropPercent), or
      # any heading, internal link, image, structured data or page setting (draft, noindex, canonical, permalink...), or
      # when a page was removed. Hidden or commented-out text does not count as kept. It runs before the install and build,
      # from a folder OUTSIDE the checkout: nothing from the pull request (.npmrc, package.json, node_modules, scripts) is
      # read or run, and every setting it uses comes from the BASE branch's seo-autopilot.config.json, so a pull request
      # cannot loosen its own check. Human-only override: a person other than the pull request's author adds the label
      # allow-content-shrink after the latest push and re-runs this check (read from the pull request's events; a bot never
      # counts, and the autopilot and agents never add it; a push after the label needs the label added again).
      # A seo/revert-<n> branch may restore older content only when seo-watch opened it (author and seo-revert label both
      # the workflow's bot) AND it is exactly the undo of #n's merge, or exactly the unpublish of the pages #n added.
      # When seo-watch calls this check there is no pull_request event, so the pull request is looked up by its branch.
      - name: Content-loss guard on the changed pages
        env:
          BASE: ${{ inputs.base || github.base_ref }}
          BRANCH: ${{ inputs.ref || github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          guard="$RUNNER_TEMP/content-guard"; mkdir -p "$guard"
          if ! git -C "$GITHUB_WORKSPACE" show "origin/$BASE:seo-autopilot.config.json" > "$guard/seo-autopilot.config.json" 2>/dev/null; then
            echo "::warning::The base branch $BASE has no seo-autopilot.config.json yet, so there is nothing to compare; content-loss guard skipped."
            exit 0
          fi
          labels=""; events="$guard/label-events.jsonl"; revert_of="$guard/revert-of.json"; : > "$events"; : > "$revert_of"
          if [ -z "${PR:-}" ] && [ -n "${BRANCH:-}" ]; then
            found=$(gh api "repos/$GH_REPO/pulls?state=open&head=${GH_REPO%%/*}:$BRANCH" --jq '.[0] // empty | "\(.number) \(.user.login)"' 2>/dev/null || true)
            if [ -n "$found" ]; then PR="${found%% *}"; AUTHOR="${found#* }"; fi
          fi
          if [ -n "${PR:-}" ]; then
            labels=$(gh api "repos/$GH_REPO/issues/$PR/labels" --jq '[.[].name] | join(",")' 2>/dev/null || true)
            case ",$labels," in *,allow-content-shrink,*|*,seo-revert,*)
              gh api "repos/$GH_REPO/issues/$PR/events" --paginate --jq '.[] | select(.event == "labeled") | {event, label: .label.name, actor: .actor.login, type: .actor.type, created_at}' > "$events" 2>/dev/null || : > "$events";;
            esac
          fi
          # The pull request a seo/revert-<n> branch undoes: its merge commit, branch and commit subjects.
          n="${BRANCH#seo/revert-}"
          case "$BRANCH:$n" in seo/revert-*:*[!0-9]*|seo/revert-*:) ;; seo/revert-*)
            if gh api "repos/$GH_REPO/pulls/$n" --jq '{number, merged, mergeCommit: .merge_commit_sha, headRefName: .head.ref}' > "$guard/pr.json" 2>/dev/null \
              && gh api "repos/$GH_REPO/pulls/$n/commits" --paginate --jq '.[].commit.message | split("\n")[0]' > "$guard/commits.txt" 2>/dev/null; then
              jq --rawfile c "$guard/commits.txt" '. + {commits: ($c | split("\n") | map(select(length > 0)))}' "$guard/pr.json" > "$revert_of" || : > "$revert_of"
            fi;;
          esac
          cd "$guard"
          npx --yes "$SEO" run content-guard --repo "$GITHUB_WORKSPACE" --base "origin/$BASE" --branch="$BRANCH" --labels="$labels" --events "$events" --author="${AUTHOR:-}" --revert-of="$revert_of"
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || { echo "::warning::npm ci rejected package-lock.json (often a different npm version than the one that wrote it). Falling back to npm install for this check; regenerate and commit the lockfile when you can."; npm install --no-audit --no-fund; }
          elif [ -f package.json ]; then npm install --no-audit --no-fund; fi
      - name: Build and validate the content
        run: npm run build
      # Every number, price, award or client claim in the changed content must be in verified-facts.json or carry a source.
      # Warns by default; set "facts": { "strict": true } in seo-autopilot.config.json to make an unverified claim fail the check.
      - name: Facts guard on the changed content
        env:
          BASE: ${{ inputs.base || github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD" -- '*.json' '*.md' '*.mdx' | { grep -v '^seo-autopilot' || true; } | paste -sd, -)
          if [ -n "$files" ]; then npx --yes "$SEO" run facts --files "$files"; else echo "No content files changed."; fi
      # hreflang pairs: for every translation group declared in the site config ("translations"), both pages must link to each
      # other (and to themselves). A site with no groups skips this. It warns by default; "hreflang": { "block": true } makes a
      # missing or one-way link fail the check. Pages are read from the folder named by hreflang.buildDir (what the build wrote).
      # block, xDefault and buildDir come from the BASE branch's config, so a pull request cannot loosen its own check.
      - name: hreflang pairs on the declared translations
        env:
          BASE: ${{ inputs.base || github.base_ref }}
        run: npx --yes "$SEO" run hreflang --base "origin/$BASE"
      # Style guide: the exact phrases and the punctuation a program can find in the changed content, per language, against the
      # built-in Arabic (Modern Standard Arabic) guide and the site's own file ("styleGuide" in seo-autopilot.config.json).
      # Warns only (the editor agent reports every violation with its rule ID). A site with no guide for the language skips it.
      - name: Style guide on the changed content
        env:
          BASE: ${{ inputs.base || github.base_ref }}
        run: |
          files=$(git diff --name-only "origin/$BASE...HEAD" -- '*.json' '*.md' '*.mdx' | { grep -v '^seo-autopilot' || true; } | paste -sd, -)
          if [ -n "$files" ]; then npx --yes "$SEO" run style --language all --files "$files"
          else echo "No content files changed."; fi

  # Posts the build result as the commit status "seo-check" on the commit the build job checked, where the pull request,
  # branch protection and seo-automerge see it (a dispatched or called run's own check is not listed on the pull request,
  # and seo-automerge accepts only this status). Runs for seo/ branches of this repository only: a fork's pull_request run
  # has a read-only token. A separate job: the build above, which runs project code, never holds a token that can write.
  status:
    needs: build
    if: >-
      always() && needs.build.result != 'skipped' && (startsWith(inputs.ref, 'seo/') || (
      startsWith(github.head_ref, 'seo/') && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Post the build result as the commit status
        env:
          GH_TOKEN: ${{ github.token }}   # this job's own token: statuses only, no repository secrets
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.build.outputs.sha }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SHA" ]; then echo "::error::The build stopped before it recorded its commit; no status posted (seo-automerge will not merge)."; exit 1; fi
          if [ "$RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api "repos/$GH_REPO/statuses/$SHA" -f state="$state" -f context=seo-check -f description="Build and facts guard: $RESULT" -f target_url="$RUN_URL" > /dev/null
